name: Create release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic Go module version, for example v1.1.0 or v1.2.0-rc.1
        required: true
        type: string
      commit:
        description: Exact 40-character commit SHA already validated on main
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version and commit
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid semantic Go module version: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit must be a complete lowercase 40-character SHA" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          git cat-file -e "${COMMIT}^{commit}"
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "$COMMIT is not contained in origin/main" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag already exists: $VERSION" >&2
            exit 1
          fi

      - name: Require successful CI for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          response=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$COMMIT&per_page=1")
          count=$(jq -r '.total_count' <<<"$response")
          run_sha=$(jq -r '.workflow_runs[0].head_sha // ""' <<<"$response")
          run_url=$(jq -r '.workflow_runs[0].html_url // ""' <<<"$response")

          if [[ "$count" -lt 1 || "$run_sha" != "$COMMIT" ]]; then
            echo "no successful push-triggered CI run found for $COMMIT" >&2
            exit 1
          fi
          echo "validated CI run: $run_url"

      - name: Create and push annotated tag
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$COMMIT" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
