name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify, for example v1.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ inputs.version || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - name: Validate version input
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable Go module version such as v1.4.0"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected-main ancestry and release metadata
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import { validateReleaseMetadata } from './scripts/ci-scope.mjs';
          if (`v${validateReleaseMetadata()}` !== process.env.VERSION) {
            throw new Error('tag does not match the committed release metadata');
          }
          JS
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: false
      - name: Build a fresh consumer from the public Go proxy
        run: bash scripts/consumer-smoke.sh "$VERSION"
