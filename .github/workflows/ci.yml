name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Test CI classification and required-check aggregation
        run: node --test scripts/ci-*.test.mjs
      - name: Inspect PR changes and release metadata
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-scope.mjs
      - name: Check diff whitespace
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$PR_BASE_SHA" HEAD

  test:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.23.x
          - 1.25.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: make test
      - run: go build ./example/...
      - run: bash scripts/consumer-smoke.sh

  race-and-static:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: false
      - run: make verify-upstream check-generated vet
      - name: Check Go formatting
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - run: make test-race
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run ./...
      - run: cd cmd/generate && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run ./...

  windows-stdio:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: false
      - run: go test -race ./transport/stdio
      - run: go test -race -count=10 -run 'TestProcessShutdownTerminatesOwnedProcessTree|TestWindowsShutdownConvergesWhileDescendantsSpawn' ./transport/stdio

  official-sdk-interop:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: interop/peers/typescript/package-lock.json
      - run: rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
      - run: make interop
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-sdk-interop-evidence
          path: |
            .artifacts/interop/
            interop/versions.json
            interop/peers/typescript/package-lock.json
            interop/peers/rust/Cargo.lock
          if-no-files-found: error

  quality:
    needs: [changes, test, race-and-static, windows-stdio, official-sdk-interop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify all selected checks passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          TEST_RESULT: ${{ needs.test.result }}
          RACE_RESULT: ${{ needs.race-and-static.result }}
          WINDOWS_RESULT: ${{ needs.windows-stdio.result }}
          INTEROP_RESULT: ${{ needs.official-sdk-interop.result }}
        run: bash scripts/ci-result.sh
