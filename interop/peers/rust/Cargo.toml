[package]
name = "acp-go-sdk-rust-interop-peer"
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"
publish = false

[dependencies]
agent-client-protocol = "=2.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
